name: Docs

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Two deploys must not run at the same time. `deploydocs(; forcepush = true)` amends and force-pushes
# `gh-pages`, so a second run pushing over the first loses whichever snapshot lands second. Queue
# them instead of cancelling: a cancelled run may stop in the middle of that push.
#
# A pull request is one of those runs: `push_preview` in `docs/make.jl` puts its site at
# `previews/PR<n>/`, which amends and force-pushes the same branch. So every run this workflow starts
# shares the one group, and this workflow is the only thing that writes `gh-pages`.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The prune step asks whether a pull request is still open.
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v2
      - name: Build and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GKSwstype: "100"

      # A preview belongs to an open pull request, and nothing else on `gh-pages` ever removes one:
      # `deploydocs` keeps `previews` when it clears the branch, which is what lets a preview outlive
      # the deploys that follow it. So a directory per merged branch is the branch growing without
      # limit.
      #
      # The prune runs here, in the job that deploys, and not in a workflow that a pull request
      # closing starts. Two workflows that both force-push this branch race: a deploy that read the
      # branch before the other one pushed puts back the preview that other one removed, minutes
      # later. One writer cannot race itself. This also repairs itself, because every deploy prunes
      # again, so a run that fails costs a delay rather than a preview that stays for good.
      - name: Read the published branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: .gh-pages
      - name: Remove the preview of every closed pull request
        if: github.event_name != 'pull_request'
        working-directory: .gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stale=()
          for dir in previews/PR*; do
            [ -d "$dir" ] || continue
            number=${dir#previews/PR}
            state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)
            case "$state" in
              # No answer names no state. Keep the preview: a preview that outstays its pull request
              # costs disk, and one removed under a pull request still open costs a reviewer the page.
              OPEN|"") echo "keeping $dir (state \"${state:-no answer}\")" ;;
              *) stale+=("$dir") ;;
            esac
          done
          if [ ${#stale[@]} -eq 0 ]; then
            echo "every preview belongs to an open pull request"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rqf -- "${stale[@]}"
          git commit -qm "Remove the preview of every closed pull request"
          # One commit, as `deploydocs(; forcepush = true)` leaves it. Committing the tree on its own
          # is what drops the removed sites from the history as well as from the branch — a removal
          # that only added a commit would keep every byte of them in what a clone fetches.
          git push -q --force origin $(git commit-tree HEAD^{tree} -m "Documentation"):gh-pages
          echo "removed: ${stale[*]}"
